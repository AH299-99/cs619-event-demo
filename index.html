<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Discovery Platform — Live Demo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body { background:#0f172a; color:#e2e8f0; }
  a { color:#818cf8; }
  /* ---------- header ---------- */
  header { background:linear-gradient(135deg,#4f46e5,#7c3aed); padding:26px 20px 20px; text-align:center; }
  header h1 { font-size:26px; margin-bottom:6px; }
  header p { opacity:.85; font-size:14px; }
  .badge { display:inline-block; background:#22c55e; color:#04140a; font-size:12px; font-weight:700; padding:4px 12px; border-radius:20px; margin-top:10px; }
  /* ---------- search ---------- */
  .searchbar { max-width:640px; margin:18px auto 0; padding:0 16px; position:relative; }
  .searchbar input { width:100%; padding:12px 44px 12px 16px; border-radius:10px; border:1px solid #334155; background:#1e293b; color:#e2e8f0; font-size:15px; }
  .searchbar input::placeholder { color:#64748b; }
  .searchbar .clear { position:absolute; right:26px; top:50%; transform:translateY(-50%); background:none; border:none; color:#94a3b8; font-size:20px; cursor:pointer; display:none; }
  /* ---------- filters ---------- */
  .filters { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding:14px 16px 4px; }
  .filters button { border:1px solid #334155; background:#1e293b; color:#e2e8f0; padding:8px 16px; border-radius:20px; cursor:pointer; font-size:13px; min-height:40px; }
  .filters button.active { background:#4f46e5; border-color:#4f46e5; }
  /* ---------- featured ---------- */
  .section-title { max-width:1200px; margin:22px auto 12px; padding:0 16px; font-size:20px; }
  .featured { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; max-width:1200px; margin:0 auto; padding:0 16px; }
  .fcard { background:#1e293b; border-radius:12px; overflow:hidden; border:1px solid #334155; }
  .fcard img { width:100%; height:150px; object-fit:cover; display:block; }
  .fcard .body { padding:14px; }
  .fcard h3 { font-size:16px; margin-bottom:6px; }
  .fcard .meta { font-size:13px; color:#94a3b8; margin-bottom:8px; }
  .fcard .desc { font-size:13px; color:#cbd5e1; margin-bottom:10px; line-height:1.5; }
  .catpill { display:inline-block; font-size:11px; font-weight:700; padding:2px 10px; border-radius:10px; color:#fff; margin-bottom:8px; }
  .btn { display:inline-block; background:#4f46e5; color:#fff; text-decoration:none; padding:10px 18px; border-radius:8px; font-size:14px; border:none; cursor:pointer; min-height:44px; }
  .btn:hover { background:#4338ca; }
  /* ---------- map + list ---------- */
  .mobile-tabs { display:none; justify-content:center; gap:8px; padding:12px 16px 0; }
  .mobile-tabs button { flex:1; max-width:200px; padding:12px; border-radius:10px; border:1px solid #334155; background:#1e293b; color:#e2e8f0; font-size:14px; cursor:pointer; min-height:48px; }
  .mobile-tabs button.active { background:#4f46e5; border-color:#4f46e5; }
  .wrap { display:flex; flex-wrap:wrap; gap:16px; padding:16px; max-width:1200px; margin:0 auto 30px; }
  #map { flex:1 1 480px; height:480px; border-radius:12px; z-index:1; min-width:300px; }
  .list { flex:1 1 320px; display:flex; flex-direction:column; gap:12px; max-height:480px; overflow-y:auto; min-width:300px; }
  .card { background:#1e293b; border-radius:12px; padding:14px; border-left:4px solid #4f46e5; cursor:pointer; transition:transform .15s; display:flex; gap:12px; }
  .card:hover, .card.hovered { transform:translateY(-2px); background:#243049; }
  .card img.thumb { width:88px; height:88px; object-fit:cover; border-radius:8px; flex-shrink:0; }
  .card .info { flex:1; }
  .card h3 { font-size:15px; margin-bottom:4px; }
  .card .meta { font-size:12px; color:#94a3b8; margin-bottom:4px; }
  .card .desc { font-size:12px; color:#cbd5e1; margin-bottom:6px; }
  .price { font-weight:700; color:#22c55e; font-size:14px; }
  .noresults { text-align:center; padding:40px 20px; color:#94a3b8; }
  /* ---------- detail page ---------- */
  #detailView { display:none; max-width:900px; margin:0 auto; padding:20px 16px 40px; }
  .breadcrumb { font-size:14px; color:#94a3b8; margin-bottom:18px; }
  .breadcrumb a { color:#818cf8; text-decoration:none; }
  .gallery { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  .gallery img { width:100%; height:220px; object-fit:cover; border-radius:12px; }
  .detail-box { background:#1e293b; border-radius:12px; padding:24px; margin-bottom:16px; }
  .detail-box h2 { font-size:24px; margin-bottom:12px; }
  .detail-box .row { font-size:14px; color:#cbd5e1; margin-bottom:10px; line-height:1.6; }
  .detail-box .row b { color:#e2e8f0; }
  #minimap { height:300px; border-radius:12px; z-index:1; margin-top:12px; }
  footer { text-align:center; padding:20px; color:#64748b; font-size:12px; }
  @media (max-width:768px) {
    .mobile-tabs { display:flex; }
    #map { display:none; height:420px; flex:1 1 100%; }
    #map.show-mobile { display:block; }
    .list { display:none; max-height:none; flex:1 1 100%; }
    .list.show-mobile { display:flex; }
    .gallery { grid-template-columns:1fr; }
    .gallery img { height:200px; }
  }
</style>
</head>
<body>

<!-- ============ HOME VIEW ============ -->
<div id="homeView">
  <header>
    <h1>🎪 Event Discovery Platform</h1>
    <p>Find events around you — map, filters, RSVP. CS619 Final Year Project</p><br>
    <span class="badge">● LIVE PROTOTYPE DEMO — LAHORE, PAKISTAN</span>
  </header>

  <div class="searchbar">
    <input type="text" id="searchInput" placeholder="🔍 Search events by name, category, organizer or venue…" aria-label="Search events">
    <button class="clear" id="clearSearch" aria-label="Clear search">×</button>
  </div>

  <div class="filters" id="filters"></div>

  <h2 class="section-title">⭐ Featured Events</h2>
  <div class="featured" id="featured"></div>

  <h2 class="section-title">🗺 Explore Events</h2>
  <div class="mobile-tabs">
    <button id="tabMap" class="active">🗺 Map</button>
    <button id="tabList">📋 List</button>
  </div>
  <div class="wrap">
    <div id="map" class="show-mobile"></div>
    <div class="list" id="list"></div>
  </div>
</div>

<!-- ============ DETAIL VIEW ============ -->
<div id="detailView"></div>

<footer>Backend: Strapi v5 CMS &nbsp;•&nbsp; Frontend: Next.js + Leaflet.js &nbsp;•&nbsp; Built by Azmat Hayat</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ================= DATA (from Strapi backend seed) ================= */
const CATS = [
  {slug:'music', name:'Music', color:'#e11d48'},
  {slug:'sports', name:'Sports', color:'#16a34a'},
  {slug:'technology', name:'Technology', color:'#2563eb'},
  {slug:'art-culture', name:'Art & Culture', color:'#9333ea'},
  {slug:'food-drink', name:'Food & Drink', color:'#ea580c'},
  {slug:'health-wellness', name:'Health & Wellness', color:'#0891b2'},
  {slug:'community-service', name:'Community Service', color:'#0d9488'},
];
const IMG = id => `https://images.unsplash.com/${id}?w=800&q=60`;
const EVENTS = [
  {
    slug:'lahore-music-night', title:'Lahore Music Night', cat:'music',
    venue:{name:'Alhamra Arts Council', address:'68 Mall Road, Lahore, Punjab, Pakistan', lat:31.5656, lng:74.3242},
    date:'Sat, 15 Nov 2026', time:'7:00 PM – 11:00 PM', price:500, free:false, featured:true,
    organizer:{name:'Hayat Events', phone:'0300-1234567', email:'info@hayatevents.pk'},
    shortDesc:'Live concert with top singers under the open sky.',
    fullDesc:'Lahore Music Night brings the city\'s best vocalists and bands to the iconic Alhamra Arts Council for an unforgettable evening. Enjoy live performances ranging from classical and folk to modern pop, with food stalls and a vibrant crowd. Gates open at 6:00 PM — bring your friends and family!',
    images:[IMG('photo-1470229722913-7c0e2dbbafd3'), IMG('photo-1501281668745-f7f57925c3b4')],
  },
  {
    slug:'tech-innovators-meetup', title:'Tech Innovators Meetup', cat:'technology',
    venue:{name:'Expo Centre Lahore', address:'Abdul Haque Road, Johar Town, Lahore, Punjab, Pakistan', lat:31.4697, lng:74.2728},
    date:'Sun, 16 Nov 2026', time:'10:00 AM – 4:00 PM', price:0, free:true, featured:true,
    organizer:{name:'Lahore Tech Community', phone:'0300-2345678', email:'hello@lhrtech.pk'},
    shortDesc:'Monthly meetup for developers and startups of Lahore.',
    fullDesc:'The Tech Innovators Meetup is Lahore\'s monthly gathering of developers, designers, founders and students. This edition features talks on AI tools, freelancing, and web development, plus networking sessions and a startup showcase. Whether you are a beginner or a pro, come learn, connect and grow. Entry is completely free — just bring your curiosity!',
    images:[IMG('photo-1540575467063-178a50c2df87'), IMG('photo-1515187029135-18ee286d815b')],
  },
  {
    slug:'lahore-marathon-2026', title:'Lahore Marathon 2026', cat:'sports',
    venue:{name:'Gaddafi Stadium', address:'Hafeez Kardar Road, Gulberg III, Lahore, Punjab, Pakistan', lat:31.5139, lng:74.3333},
    date:'Sun, 23 Nov 2026', time:'6:00 AM – 11:00 AM', price:200, free:false, featured:false,
    organizer:{name:'Lahore Running Club', phone:'0300-3456789', email:'run@lhrrun.pk'},
    shortDesc:'Annual 10km city marathon — all ages welcome.',
    fullDesc:'The Lahore Marathon 2026 is back! Run through the heart of the city starting at the historic Gaddafi Stadium. Choose from the full 10km race, a 5km fun run, or the 1km family walk. All finishers receive a medal, t-shirt and refreshments. Professional timing, medical support and water stations are provided along the route.',
    images:[IMG('photo-1461896836934-ffe607ba8211'), IMG('photo-1552674605-db6ffd4facb5')],
  },
  {
    slug:'lahore-food-festival', title:'Lahore Food Festival', cat:'food-drink',
    venue:{name:'Fort Road Food Street', address:'Fort Road, Near Badshahi Mosque, Lahore, Punjab, Pakistan', lat:31.5855, lng:74.3095},
    date:'Fri – Sun, 28–30 Nov 2026', time:'12:00 PM – 11:00 PM', price:100, free:false, featured:false,
    organizer:{name:'Foodies of Lahore', phone:'0300-4567890', email:'taste@foodiesoflahore.pk'},
    shortDesc:'Taste 50+ local dishes with a view of Badshahi Mosque.',
    fullDesc:'Three days of pure Lahori flavour at the famous Fort Road Food Street! Over 50 stalls serving chargha, taka-tak, falooda, BBQ and traditional desserts — all with the stunning Badshahi Mosque as your backdrop. Live cooking demos, a food-eating contest, and kids\' activities make this perfect for the whole family.',
    images:[IMG('photo-1504674900247-0877df9cc836'), IMG('photo-1414235077428-338989a2e8c0')],
  },
];

/* ================= HELPERS ================= */
const catOf = s => CATS.find(c=>c.slug===s) || {name:s, color:'#4f46e5'};
const evOf = slug => EVENTS.find(e=>e.slug===slug);
const priceText = e => e.free ? 'FREE ENTRY' : 'Rs ' + e.price;
const directionsURL = e => `https://www.google.com/maps/dir/?api=1&destination=${e.venue.lat},${e.venue.lng}`;

let selectedCats = new Set();   // empty = all (FR-03 multi-select)
let searchQuery = '';
let highlightedSlug = null;
let map, markers = {}, miniMap = null;

/* ================= FILTER LOGIC (FR-03 + FR-08) ================= */
function filteredEvents(){
  const q = searchQuery.trim().toLowerCase();
  return EVENTS.filter(e=>{
    if (selectedCats.size && !selectedCats.has(e.cat)) return false;
    if (!q) return true;
    const hay = [e.title, catOf(e.cat).name, e.organizer.name, e.venue.name, e.venue.address].join(' ').toLowerCase();
    return hay.includes(q);
  });
}

/* ================= MAP (FR-01 + FR-06) ================= */
function makeIcon(color, big){
  const s = big ? 40 : 26;
  return L.divIcon({
    html:`<div style="background:${color};width:${s}px;height:${s}px;border-radius:50%;border:${big?4:3}px solid #fff;box-shadow:0 2px ${big?12:6}px rgba(0,0,0,.5)${big?';outline:3px solid '+color:''}"></div>`,
    iconSize:[s,s], iconAnchor:[s/2,s/2], className:''
  });
}
function initMap(){
  map = L.map('map').setView([31.53, 71.578], 1); // temp, fitBounds below
  map.setView([31.53, 74.31], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
  refreshMarkers(true);
}
function refreshMarkers(fit=false){
  Object.values(markers).forEach(m=>map.removeLayer(m)); markers={};
  const list = filteredEvents();
  list.forEach(e=>{
    const c = catOf(e.cat).color;
    const m = L.marker([e.venue.lat,e.venue.lng],{icon:makeIcon(c, e.slug===highlightedSlug)})
      .addTo(map)
      .bindPopup(`<b>${e.title}</b><br>🗓 ${e.date}<br>🏷 ${catOf(e.cat).name}`);
    m.on('click',()=>{ location.hash = '#/events/'+e.slug; });
    markers[e.slug]=m;
  });
  if (fit && list.length){
    map.fitBounds(L.latLngBounds(list.map(e=>[e.venue.lat,e.venue.lng])).pad(0.25));
  }
  if (highlightedSlug && markers[highlightedSlug]){
    const e = evOf(highlightedSlug);
    markers[highlightedSlug].setIcon(makeIcon(catOf(e.cat).color,true));
  }
}
function highlightMarker(slug, pan=true){
  highlightedSlug = slug;
  Object.entries(markers).forEach(([s,m])=>{
    const e = evOf(s);
    m.setIcon(makeIcon(catOf(e.cat).color, s===slug));
  });
  if (slug && markers[slug] && pan){
    const e = evOf(slug);
    map.flyTo([e.venue.lat,e.venue.lng], 15, {duration:0.8});
    markers[slug].openPopup();
  }
}

/* ================= HOME RENDER ================= */
function renderFilters(){
  const box = document.getElementById('filters');
  let html = `<button data-cat="" class="${selectedCats.size===0?'active':''}">All</button>`;
  html += CATS.map(c=>`<button data-cat="${c.slug}" class="${selectedCats.has(c.slug)?'active':''}">${c.name}</button>`).join('');
  box.innerHTML = html;
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const c = b.dataset.cat;
    if (!c) selectedCats.clear();
    else { selectedCats.has(c) ? selectedCats.delete(c) : selectedCats.add(c); }
    renderHome(false);
  });
}
function renderFeatured(){
  const box = document.getElementById('featured');
  const feats = filteredEvents().filter(e=>e.featured);
  box.innerHTML = feats.length ? feats.map(e=>`
    <div class="fcard">
      <img src="${e.images[0]}" alt="${e.title} — event photo" loading="lazy">
      <div class="body">
        <span class="catpill" style="background:${catOf(e.cat).color}">${catOf(e.cat).name}</span>
        <h3>${e.title}</h3>
        <div class="meta">🗓 ${e.date} &nbsp;•&nbsp; ${e.time}</div>
        <div class="desc">${e.shortDesc}</div>
        <a class="btn" href="#/events/${e.slug}">View Details →</a>
      </div>
    </div>`).join('')
    : '<div class="noresults">No featured events match your filters.</div>';
}
function renderList(){
  const box = document.getElementById('list');
  const list = filteredEvents();
  box.innerHTML = list.length ? list.map(e=>`
    <div class="card" data-slug="${e.slug}" style="border-left-color:${catOf(e.cat).color}">
      <img class="thumb" src="${e.images[0]}" alt="${e.title} — thumbnail" loading="lazy">
      <div class="info">
        <h3>${e.title}</h3>
        <div class="meta">📍 ${e.venue.name} &nbsp;•&nbsp; 🗓 ${e.date}</div>
        <div class="meta">🏷 ${catOf(e.cat).name}</div>
        <div class="desc">${e.shortDesc}</div>
        <div class="price">${priceText(e)}</div>
      </div>
    </div>`).join('')
    : '<div class="noresults"><h3>😕 No results found</h3><p>Try a different search or clear the filters.</p></div>';
  box.querySelectorAll('.card').forEach(card=>{
    const slug = card.dataset.slug;
    card.addEventListener('mouseenter',()=>highlightMarker(slug,false)); // FR-02 hover sync
    card.addEventListener('mouseleave',()=>highlightMarker(null,false));
    card.addEventListener('click',()=>{ highlightMarker(slug); setTimeout(()=>{ location.hash='#/events/'+slug; }, 900); });
  });
}
function renderHome(refitMap=true){
  document.getElementById('homeView').style.display='block';
  document.getElementById('detailView').style.display='none';
  if (miniMap){ miniMap.remove(); miniMap=null; }
  renderFilters(); renderFeatured(); renderList();
  refreshMarkers(refitMap);
  setTimeout(()=>map.invalidateSize(), 100);
}

/* ================= DETAIL PAGE (FR-04 + FR-05 + FR-09) ================= */
function renderDetail(slug){
  const e = evOf(slug);
  const box = document.getElementById('detailView');
  if (!e){ location.hash='#/'; return; }
  document.getElementById('homeView').style.display='none';
  box.style.display='block';
  box.innerHTML = `
    <div class="breadcrumb"><a href="#/">Home</a> &nbsp;/&nbsp; <a href="#/">Events</a> &nbsp;/&nbsp; ${e.title}</div>
    <div class="gallery">
      <img src="${e.images[0]}" alt="${e.title} — photo 1" loading="lazy">
      <img src="${e.images[1]}" alt="${e.title} — photo 2" loading="lazy">
    </div>
    <div class="detail-box">
      <span class="catpill" style="background:${catOf(e.cat).color}">${catOf(e.cat).name}</span>
      ${e.featured?'<span class="catpill" style="background:#f59e0b;color:#1c1005">⭐ FEATURED</span>':''}
      <h2>${e.title}</h2>
      <div class="row">${e.fullDesc}</div>
      <div class="row">📍 <b>Venue:</b> ${e.venue.name}<br>&nbsp;&nbsp;&nbsp;&nbsp;<b>Address:</b> ${e.venue.address}</div>
      <div class="row">🗓 <b>Date:</b> ${e.date}<br>🕒 <b>Time:</b> ${e.time}</div>
      <div class="row">🎟 <b>Ticket:</b> <span class="price">${priceText(e)}</span></div>
      <div class="row">📞 <b>Organizer:</b> ${e.organizer.name} — ${e.organizer.phone}<br>✉️ ${e.organizer.email}</div>
      <div class="row">
        <a class="btn" href="${directionsURL(e)}" target="_blank" rel="noopener">📍 Get Directions</a>
        &nbsp;<a class="btn" href="#/" style="background:#334155">← Back to Events</a>
      </div>
      <div id="minimap"></div>
    </div>`;
  miniMap = L.map('minimap',{scrollWheelZoom:false}).setView([e.venue.lat,e.venue.lng],16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(miniMap);
  L.marker([e.venue.lat,e.venue.lng],{icon:makeIcon(catOf(e.cat).color,true)}).addTo(miniMap)
    .bindPopup(`<b>${e.title}</b><br>${e.venue.name}`).openPopup();
  window.scrollTo(0,0);
}

/* ================= ROUTER ================= */
function route(){
  const h = location.hash;
  const m = h.match(/^#\/events\/([\w-]+)/);
  if (m) renderDetail(m[1]);
  else renderHome(false);
}
window.addEventListener('hashchange', route);

/* ================= SEARCH (FR-08) ================= */
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearSearch');
searchInput.addEventListener('input',()=>{
  searchQuery = searchInput.value;
  clearBtn.style.display = searchQuery ? 'block' : 'none';
  renderFeatured(); renderList(); refreshMarkers(false);
});
clearBtn.addEventListener('click',()=>{
  searchInput.value=''; searchQuery=''; clearBtn.style.display='none';
  renderFeatured(); renderList(); refreshMarkers(false);
});

/* ================= MOBILE TABS (FR-10) ================= */
const tabMap = document.getElementById('tabMap'), tabList = document.getElementById('tabList');
const mapEl = document.getElementById('map'), listEl = document.getElementById('list');
function mobileTab(which){
  const isMap = which==='map';
  tabMap.classList.toggle('active', isMap);
  tabList.classList.toggle('active', !isMap);
  mapEl.classList.toggle('show-mobile', isMap);
  listEl.classList.toggle('show-mobile', !isMap);
  if (isMap) setTimeout(()=>map.invalidateSize(), 100);
}
tabMap.onclick=()=>mobileTab('map');
tabList.onclick=()=>mobileTab('list');

/* ================= INIT ================= */
initMap();
route();
</script>
</body>
</html>
